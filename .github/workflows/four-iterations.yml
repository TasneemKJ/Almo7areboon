name: Four UI recovery iterations
on:
  push:
    branches: [chore/four-iterations-review]
    paths: ['.github/workflows/four-iterations.yml']
permissions:
  contents: write
jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extend the passing header audit without changing production code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/review-ui-recovery.mjs');s=p.read_text();old='      const r=item.metrics.gems;'
          assert s.count(old)==1
          new='''      await page.locator('[data-command="settings"]').click();
                const help=page.locator('.help-box summary');await help.scrollIntoViewIfNeeded();
                item.metrics.helpTarget=await geometry(help);await shot(page,item,'help-target');
                await help.click();check(await page.locator('.help-box').evaluate(node=>node.open),'help disclosure must open');
                check(item.metrics.helpTarget.width>=44&&item.metrics.helpTarget.height>=44,`help target is ${item.metrics.helpTarget.width}x${item.metrics.helpTarget.height}; expected at least 44x44`);
          '''
          p.write_text(s.replace(old,new+old))
          plan=Path('docs/superpowers/plans/2026-10-02-four-ui-recovery-iterations.md')
          plan.write_text(plan.read_text()+'\nRuling: The header gems control already measures 44px and is left unchanged. Extend Iteration 1 to the How to play disclosure within the same touch-target audit. Iterations 2–4 were reproduced on all three Chromium viewports; baseline report retained in qa/four-iterations/baseline.\n')
          npm ci > qa/four-iterations/install-touch.log 2>&1
          node --check scripts/review-ui-recovery.mjs
          npm run build > qa/four-iterations/build-touch.log 2>&1
          npx playwright install --with-deps chromium > qa/four-iterations/browser-touch.log 2>&1
      - name: Capture the additional touch-target baseline
        env:
          UI_REVIEW_OUT: qa/four-iterations/baseline-touch
          UI_ITERATIONS: '1'
        run: |
          result=0
          node --experimental-strip-types scripts/review-ui-recovery.mjs > qa/four-iterations/baseline-touch.log 2>&1 || result=$?
          cat qa/four-iterations/baseline-touch.log
          echo "Touch baseline exit code: $result"
          test -f qa/four-iterations/baseline-touch/report.json
      - name: Retain the test and evidence on the diagnostic branch only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/review-ui-recovery.mjs docs/superpowers/plans/2026-10-02-four-ui-recovery-iterations.md
          git add -f qa/four-iterations
          if ! git diff --cached --quiet; then git commit -m 'test: retain the help-touch reproduction and audit ruling'; git push origin HEAD:refs/heads/chore/four-iterations-review; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-iterations-touch-baseline
          path: qa/four-iterations/baseline-touch*
          retention-days: 7
