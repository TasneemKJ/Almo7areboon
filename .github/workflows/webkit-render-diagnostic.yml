name: WebKit render diagnostic
on:
  push:
    branches: [chore/webkit-render-diagnostic]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: |
          mkdir -p artifacts/webkit-render-diagnostic
          npm run preview -- --port 4173 > artifacts/webkit-render-diagnostic/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node --experimental-strip-types scripts/qa/webkit-framebuffer-diagnostic.mjs | tee artifacts/webkit-render-diagnostic/framebuffer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-framebuffer-diagnostic
          path: artifacts/webkit-render-diagnostic/
          retention-days: 7
