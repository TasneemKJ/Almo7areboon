name: Assemble and verify folktale expansion
on:
  push:
    branches: [feat/folktale-tactics-expansion]
    paths:
      - _delivery/**
      - .github/workflows/chronicle-assemble.yml
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/feat/folktale-tactics-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/folktale-tactics-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply digest-checked source changes
        run: python3 _delivery/apply.py
      - name: Commit implementation to this feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts
          git commit -m 'feat: integrate twenty folktale tactics systems with migration and regression coverage'
          git push origin HEAD:feat/folktale-tactics-expansion
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playtest production through real controls
        run: |
          npm run preview -- --port 4173 > /tmp/chronicle-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node --experimental-strip-types scripts/review-chronicle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folktale-tactics-review
          path: artifacts/chronicle
          retention-days: 7
