name: Bounded WebKit recovery
on:
  push:
    branches: [fix/webkit-battlefield-recovery]
permissions: {contents: read}
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: node --check scripts/qa40/repro-webkit-cycle.mjs
      - run: npx playwright install --with-deps webkit
      - name: Reproduce iteration 39 three times
        run: |
          for n in 1 2 3; do QA_OUT=artifacts/repro-$n node --experimental-strip-types scripts/qa40/repro-webkit-cycle.mjs || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-webkit-repro
          path: artifacts/
          retention-days: 7
