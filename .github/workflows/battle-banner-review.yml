name: Battle banner and Journey review
on:
  pull_request:
  push:
    branches: [feat/battle-banner-journey-20261004, feat/village-orders-answer-20261004]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: battle-banner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check scripts/verify-battle-banner.mjs
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Native mobile orders, Journey, offline play and twenty cycles
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: node --experimental-strip-types scripts/verify-battle-banner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: battle-banner-${{ matrix.engine }}
          path: artifacts/battle-banner/
          retention-days: 7
