name: Battle banner and Journey review
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: battle-banner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check scripts/verify-battle-banner.mjs
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Native mobile orders, Journey, offline play and twenty cycles
        env:
          QA_ENGINE: ${{ matrix.engine }}
        run: node --experimental-strip-types scripts/verify-battle-banner.mjs
      - name: Trim failure evidence
        if: failure()
        run: bash scripts/trim-evidence.sh evidence artifacts/battle-banner
      - name: Publish failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: battle-banner-failure-${{ matrix.engine }}
          path: evidence/
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 1
