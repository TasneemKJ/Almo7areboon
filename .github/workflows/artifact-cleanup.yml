# Deletes stored Actions artifacts so the account's artifact storage quota
# never fills. Runs daily; run it manually with a smaller age to purge sooner.
name: Artifact cleanup

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: Delete artifacts older than this many hours
        required: false
        default: '24'

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete artifacts older than the cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours || '24' }}
        run: |
          set -euo pipefail
          if ! [[ "$MIN_AGE_HOURS" =~ ^[0-9]+$ ]] || [ "$MIN_AGE_HOURS" -lt 2 ]; then
            echo "::error::min_age_hours must be a whole number of at least 2"
            exit 1
          fi
          cutoff=$(( $(date -u +%s) - MIN_AGE_HOURS * 3600 ))
          deleted=0 freed=0 kept=0
          while read -r id created size name; do
            [ -n "$id" ] || continue
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null
              deleted=$((deleted + 1)) freed=$((freed + size))
              echo "deleted $name ($size bytes, created $created)"
            else
              kept=$((kept + 1))
            fi
          done < <(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.expired | not) | "\(.id) \(.created_at) \(.size_in_bytes) \(.name)"')
          echo "Deleted $deleted artifacts ($((freed / 1048576)) MiB); kept $kept newer than ${MIN_AGE_HOURS}h." | tee -a "$GITHUB_STEP_SUMMARY"
