# Deletes stored Actions artifacts so the account's artifact storage quota
# never fills. Runs daily; run it manually with a smaller age to purge sooner.
name: Artifact cleanup

on:
  push:
    branches:
      - 'codex/artifact-cleanup-20261005-24h'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: Delete artifacts older than this many hours
        required: false
        default: '24'
      max_deletes:
        description: Stop after deleting this many (keeps the repo token under GitHub's hourly API limit)
        required: false
        default: '400'

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete artifacts older than the cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours || '24' }}
          MAX_DELETES: ${{ inputs.max_deletes || '400' }}
        run: |
          set -uo pipefail
          for v in MIN_AGE_HOURS MAX_DELETES; do
            if ! [[ "${!v}" =~ ^[0-9]+$ ]]; then echo "::error::$v must be a whole number"; exit 1; fi
          done
          if [ "$MIN_AGE_HOURS" -lt 2 ]; then echo "::error::min_age_hours must be at least 2"; exit 1; fi
          # The repo token allows about 1,000 API calls an hour; leave room for other workflows.
          remaining=$(gh api rate_limit -q .resources.core.remaining 2>/dev/null || echo 0)
          if [ "$remaining" -lt 150 ]; then
            echo "::notice::Only $remaining API calls left this hour; skipping. The next run continues." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          budget=$(( remaining - 150 )); [ "$budget" -lt "$MAX_DELETES" ] && MAX_DELETES=$budget
          cutoff=$(( $(date -u +%s) - MIN_AGE_HOURS * 3600 ))
          # Collect every candidate first, so deleting never shifts the pages being read.
          list=$(mktemp)
          if ! gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
              -q '.artifacts[] | select(.expired | not) | "\(.id) \(.created_at) \(.size_in_bytes) \(.name)"' > "$list"; then
            echo "::warning::Could not list artifacts; the next run retries." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          deleted=0 freed=0 kept=0 left=0
          while read -r id created size name; do
            [ -n "$id" ] || continue
            if [ "$(date -u -d "$created" +%s)" -ge "$cutoff" ]; then kept=$((kept + 1)); continue; fi
            if [ "$deleted" -ge "$MAX_DELETES" ]; then left=$((left + 1)); continue; fi
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>err.txt; then
              deleted=$((deleted + 1)) freed=$((freed + size))
              echo "deleted $name ($size bytes, created $created)"
            elif grep -qiE 'rate limit|HTTP 403|HTTP 429' err.txt; then
              echo "::warning::Hit the API rate limit; stopping. The next run continues."
              left=$((left + 1)); MAX_DELETES=$deleted
            elif grep -qi 'HTTP 404' err.txt; then
              :  # already gone
            else
              echo "::warning::Could not delete $name: $(head -c 200 err.txt)"
            fi
          done < "$list"
          echo "Deleted $deleted artifacts ($((freed / 1048576)) MiB); kept $kept newer than ${MIN_AGE_HOURS}h; $left left for the next run." | tee -a "$GITHUB_STEP_SUMMARY"
