name: Mobile reliability

on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Touch, short-screen and recovery regressions
        env:
          MOBILE_ASSERT: '1'
          MOBILE_ENGINES: chromium,webkit
        run: node --experimental-strip-types scripts/verify-mobile.mjs
      - name: Save ownership and recovery regressions
        if: ${{ !cancelled() }}
        run: npm run review:save-sessions
      - name: Offline return and deployment
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types scripts/capture-offline-game-review.mjs
      - name: Trim failure evidence
        if: failure()
        run: bash scripts/trim-evidence.sh evidence artifacts/mobile artifacts/save-session-review artifacts/browser-review/offline-game
      - name: Publish failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mobile-failure-evidence
          path: evidence/
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 1
