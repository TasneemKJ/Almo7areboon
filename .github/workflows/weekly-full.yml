name: Weekly full suite
# Safety net: runs everything heavy once a week on main. No deploys, no PR or push triggers.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
  full-verify:
    uses: ./.github/workflows/full-verify.yml
  battle-banner:
    uses: ./.github/workflows/battle-banner-review.yml
  chronicle:
    uses: ./.github/workflows/chronicle-review.yml
  mobile:
    uses: ./.github/workflows/mobile.yml
  reliability:
    uses: ./.github/workflows/reliability.yml
