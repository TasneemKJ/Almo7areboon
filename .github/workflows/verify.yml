name: Verify game
on:
  push:
    branches: [main, feat/finish-core-40-passes]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test simulation
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test | tee verification-tests.log
      - name: Production build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build | tee verification-build.log
      - name: Install browser for visual verification
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium
      - name: Verify native production audio controls and ownership
        id: audio_browser
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/review-audio.mjs --browser --output artifacts/audio-review/browser 2>&1 | tee verification-audio-browser.log
      - name: Publish immediate audio controls diagnostics
        if: always() && steps.audio_browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: audio-controls-browser-review
          path: |
            artifacts/audio-review/browser/
            verification-audio-browser.log
          retention-days: 7
      - name: Verify enlarged upgrade text in production
        id: upgrade_text
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run review:upgrade-text
      - name: Publish upgrade-text screenshots and diagnostics
        if: always() && steps.upgrade_text.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-text-browser-review
          path: artifacts/browser-review/upgrade-text/

          retention-days: 7
      - name: Publish focused upgrade evidence
        if: always() && steps.upgrade_text.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-text-focus-review
          path: |
            artifacts/browser-review/upgrade-text/diagnostics.json
            artifacts/browser-review/upgrade-text/*focused.png
          retention-days: 7
      - name: Verify production offline audio waveforms
        id: offline_audio
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/review-audio.mjs --offline --output artifacts/audio-review/task-1 | tee verification-audio.log
      - name: Publish offline audio WAVs and measured diagnostics
        if: always() && steps.offline_audio.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: offline-audio-review
          path: |
            artifacts/audio-review/task-1/
            verification-audio.log
          retention-days: 7
      - name: Verify production offline return and deployment
        id: offline_game
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: node --experimental-strip-types scripts/capture-offline-game-review.mjs
      - name: Publish offline game evidence
        if: always() && steps.offline_game.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: offline-game-browser-review
          path: artifacts/browser-review/offline-game/
          retention-days: 7
      - name: Verify troop unlock teaching in production
        id: troop_unlock
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: node --experimental-strip-types scripts/capture-troop-unlock-review.mjs
      - name: Publish troop unlock teaching evidence
        if: always() && steps.troop_unlock.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: troop-unlock-browser-review
          path: artifacts/browser-review/troop-unlock/
          retention-days: 7
      - name: Verify native skill timing cues
        id: skill_cues
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: node --experimental-strip-types scripts/capture-skill-cues-review.mjs
      - name: Publish skill timing evidence
        if: always() && steps.skill_cues.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: skill-cues-browser-review
          path: artifacts/browser-review/skill-cues/
          retention-days: 7
      - name: Verify regroup learning in production
        id: regroup
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: node --experimental-strip-types scripts/capture-regroup-review.mjs
      - name: Publish regroup teaching evidence
        if: always() && steps.regroup.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: regroup-browser-review
          path: artifacts/browser-review/regroup/
          retention-days: 7
      - name: Publish focused village reaction evidence
        if: always() && steps.regroup.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: village-reactions-browser-review
          path: |
            artifacts/browser-review/regroup/diagnostics.json
            artifacts/browser-review/regroup/village*.png
          retention-days: 7
      - name: Capture portrait browser states
        id: browser
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run review:browser
      - name: Verify frozen battlefield layering
        id: layering
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run review:layering
      - name: Verify exclusive save sessions and recovery
        id: save_sessions
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run review:save-sessions
      - name: Verify mastery progression and guarded result routes
        id: mastery
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run review:mastery
      - name: Publish mastery screenshots and diagnostics
        if: always() && steps.mastery.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: mastery-browser-review
          path: artifacts/browser-review/mastery/
          retention-days: 7
      - name: Publish focused scouting evidence
        if: always() && steps.mastery.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: chapter-scouting-review
          path: |
            artifacts/browser-review/mastery/diagnostics.json
            artifacts/browser-review/mastery/scouting*.png
          retention-days: 7
      - name: Publish save-session screenshots and diagnostics
        if: always() && steps.save_sessions.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: save-session-browser-review
          path: artifacts/save-session-review/
          retention-days: 7
      - name: Publish layering screenshots and diagnostics
        if: always() && steps.layering.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: layering-browser-review
          path: artifacts/browser-review/layering/
          retention-days: 7
      - name: Publish browser screenshots
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: portrait-browser-review
          path: artifacts/browser-review/*.png
          retention-days: 7
      - name: Publish Lantern screenshots
        # Chapter-specific screenshots keep individual downloads small.
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: lantern-browser-review
          path: artifacts/browser-review/lantern/*.png
          retention-days: 7
      - name: Publish Hillside screenshots
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: hillside-browser-review
          path: artifacts/browser-review/hillside/*.png
          retention-days: 7
      - name: Publish Courtyards screenshots
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: courtyards-browser-review
          path: artifacts/browser-review/courtyards/*.png
          retention-days: 7
      - name: Publish verified web build
        if: steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: almo7areboon-web-build
          path: dist/
          retention-days: 7
      - name: Package reproducible verification workspace
        if: always()
        run: |
          tar --exclude='./.git' --exclude='./dist' --exclude='./node_modules' -czf "$RUNNER_TEMP/game-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-workspace
          path: ${{ runner.temp }}/game-workspace.tar.gz
          retention-days: 3
      - name: Require passing checks
        if: always()
        env:
          VERIFICATION_STEPS: ${{ toJSON(steps) }}
          REQUIRED_CHECKS: tests build audio_browser upgrade_text offline_audio offline_game troop_unlock skill_cues regroup browser layering save_sessions mastery
        run: node scripts/require-verification.mjs
