name: Verify game
# Fast gate (target under two minutes): type check + production build and the quick unit tests.
# Heavy browser suites are manual or weekly; see README "Running the full suite".
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Type check and production build
        run: npm run build
      - name: Quick unit tests
        run: npm run test:fast
