name: Chronicle workspace
on:
  push:
    branches: [feat/folktale-tactics-expansion]
    paths: [.github/workflows/chronicle-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package source and installed dependencies for offline review
        run: |
          tar --exclude=.git --exclude=art-source --exclude=artifacts --exclude=workspace.tgz -czf /tmp/workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-workspace
          path: /tmp/workspace.tgz
          retention-days: 1
