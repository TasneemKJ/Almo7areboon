name: Mobile QA - forty recorded iterations
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: mobile-40-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Validate the campaign runners
        run: |
          node --check scripts/qa40/campaign.mjs
          node --check scripts/qa40/dialog-layout.mjs
      - name: Source regression suite
        run: npm test
      - name: Production build
        run: npm run build
  iterations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        engine: [chromium, webkit]
        ids: ['1-10', '11-20', '21-30', '31-40']
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --check scripts/qa40/campaign.mjs
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check dismiss header against the actual production template
        if: matrix.ids == '1-10'
        env:
          QA_ENGINE: ${{ matrix.engine }}
          QA_OUT: artifacts/qa40/${{ matrix.engine }}-dialog-layout
        run: node --experimental-strip-types scripts/qa40/dialog-layout.mjs
      - name: Execute ten independently recorded iterations
        env:
          QA_ENGINE: ${{ matrix.engine }}
          QA_IDS: ${{ matrix.ids }}
          QA_OUT: artifacts/qa40/${{ matrix.engine }}-${{ matrix.ids }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_OUT"
          node --experimental-strip-types scripts/qa40/campaign.mjs 2>&1 | tee "$QA_OUT/run.log"
      - name: Trim failure evidence
        if: failure()
        run: bash scripts/trim-evidence.sh evidence artifacts/qa40
      - name: Publish failure evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa40-failure-${{ matrix.engine }}-${{ matrix.ids }}
          path: evidence/
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 1
