name: Diagnose painted WebKit battlefield
on:
  push:
    branches: [diagnose/webkit-painted-battlefield-20261003]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check scripts/diagnose-webkit-painted-battlefield.mjs
      - run: npx playwright install --with-deps webkit
      - name: Reproduce with a screenshot oracle and renderer telemetry
        run: |
          status=0
          for attempt in 1 2; do
            QA_REVISION="$GITHUB_SHA" \
            QA_OUT="artifacts/attempt-$attempt" \
            node --experimental-strip-types scripts/diagnose-webkit-painted-battlefield.mjs || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painted-webkit-diagnostic
          path: artifacts/
          retention-days: 7
