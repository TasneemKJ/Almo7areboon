name: Folktale tactics review
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: chronicle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chronicle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playtest production build through real controls
        run: |
          npm run preview -- --port 4173 > /tmp/chronicle-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node --experimental-strip-types scripts/review-chronicle.mjs
      - name: Trim failure evidence
        if: failure()
        run: bash scripts/trim-evidence.sh evidence artifacts/chronicle
      - name: Publish failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-failure-evidence
          path: evidence/
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 1
