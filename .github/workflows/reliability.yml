name: Reliability checks

on:
  push:
    branches: [main, fix/game-reliability-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser gameplay and offline recovery
        run: node --experimental-strip-types scripts/verify-reliability.mjs
      - name: Saving-session regressions
        if: ${{ !cancelled() }}
        run: npm run review:save-sessions
      - name: Existing offline return regressions
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types scripts/capture-offline-game-review.mjs
      - name: Damaged saves and random input
        if: ${{ !cancelled() }}
        run: |
          npm run preview -- --port 4173 > /tmp/reliability-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          node scripts/monkey-test.mjs http://127.0.0.1:4173/ 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: |
            artifacts/reliability/
            artifacts/save-session-review/
            artifacts/browser-review/offline-game/
            /tmp/reliability-preview.log
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reliability-web-build
          path: dist/
          retention-days: 1
