# Disposable QA branch only. Exactly two bounded entry/result jobs; no manual dispatch or artifact quota gate.
name: Almo physical-play first120seconds
'on':
  push:
    branches:
      - qa/almo-world-play-20261005
permissions:
  contents: read
concurrency:
  group: almo-world-play-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: b29d6199708135f30128abc8b4eb537ea5620bf6
  REVIEW_REVISION: candidate
jobs:
  field-390:
    name: Matched first deployment and ordinary120seconds at390
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_CASE: field-390
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: baseline
          ref: bf79938e26ed2d963a76fa4db3102dd4e30fe822
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify and build immutable sources with bounded setup output
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bounded() {
            local log="${RUNNER_TEMP}/almo-entry-setup.log"
            if "$@" >"$log" 2>&1; then tail -c 12000 "$log"; else tail -c 24000 "$log"; return 1; fi
          }
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = e70db7e262a3e199771940d68319c6087817069a
          test "$(git -C baseline rev-parse HEAD)" = bf79938e26ed2d963a76fa4db3102dd4e30fe822
          git -C candidate diff --exit-code HEAD --
          git -C baseline diff --exit-code HEAD --
          (cd candidate; bounded npm ci --ignore-scripts; bounded npm run build; bounded npx playwright install --with-deps chromium)
          (cd baseline; bounded npm ci --ignore-scripts; bounded npm run build)
      - name: Baseline initial empty-profile screen
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: baseline
        env:
          SOURCE_SHA: bf79938e26ed2d963a76fa4db3102dd4e30fe822
          REVIEW_REVISION: baseline
        run: flock /tmp/browser.lock node --experimental-strip-types ../harness/scripts/capture-entry.mjs
      - name: Candidate physical recruitment and ordinary120seconds
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: candidate
        run: flock /tmp/browser.lock node --experimental-strip-types ../harness/scripts/capture-entry.mjs
      - name: Atomically transport at most three untouched originals for whole job
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 harness/scripts/emit-originals.py baseline/artifacts/entry-review candidate/artifacts/entry-review
  field-320-rotate:
    name: Physical targets, Gather and rotation during120seconds at320
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_CASE: field-320-rotate
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify and build immutable source with bounded setup output
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bounded() {
            local log="${RUNNER_TEMP}/almo-entry-setup.log"
            if "$@" >"$log" 2>&1; then tail -c 12000 "$log"; else tail -c 24000 "$log"; return 1; fi
          }
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = e70db7e262a3e199771940d68319c6087817069a
          git -C candidate diff --exit-code HEAD --
          cd candidate
          bounded npm ci --ignore-scripts
          bounded npm run build
          bounded npx playwright install --with-deps chromium
      - name: Candidate physical targets, Gather, commands and rotation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: candidate
        run: flock /tmp/browser.lock node --experimental-strip-types ../harness/scripts/capture-entry.mjs
      - name: Atomically transport at most three untouched originals for whole job
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 harness/scripts/emit-originals.py candidate/artifacts/entry-review
