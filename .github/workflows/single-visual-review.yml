# Prepared disposable QA workflow only. Three independently scoped native jobs, no dispatch or artifact quota gate.
name: Almo physical Camp exact-source review
'on':
  push:
    branches:
      - qa/almo-world-play-20261005
permissions:
  contents: read
concurrency:
  group: almo-physical-camp-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: e2d8f2f59b86caa8caf4c80bbf49ccb2e7f2b7ce
  SOURCE_TREE: dd2e1d9c59666d4ed5441514854b1275a6e44b5e
  REVIEW_REVISION: candidate
  npm_config_update_notifier: 'false'
jobs:
  camp-390:
    name: Same returning-profile ready Camp before and after at390
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_CASE: camp-390
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: baseline
          ref: 53f7bf91db2589e5590c890636c51e5f972b0269
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify immutable source and build with bounded setup output
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bounded() {
            local log="${RUNNER_TEMP}/almo-camp-setup.log"
            if "$@" >"$log" 2>&1; then tail -c 12000 "$log"; else tail -c 24000 "$log"; return 1; fi
          }
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C candidate diff --exit-code HEAD --
          test -z "$(git -C candidate ls-files --others --exclude-standard)"
          (cd candidate; bounded npm ci --ignore-scripts; bounded npm run build; bounded npx --no-install playwright install --with-deps chromium)
          test "$(git -C baseline rev-parse HEAD)" = 53f7bf91db2589e5590c890636c51e5f972b0269
          test "$(git -C baseline rev-parse HEAD^{tree})" = 49bb9cf35feda86a15797573d1e2df4b756065dd
          git -C baseline diff --exit-code HEAD --
          test -z "$(git -C baseline ls-files --others --exclude-standard)"
          (cd baseline; bounded npm ci --ignore-scripts; bounded npm run build)
      - name: Baseline ready Camp with identical returning profile
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: baseline
        env:
          SOURCE_SHA: 53f7bf91db2589e5590c890636c51e5f972b0269
          SOURCE_TREE: 49bb9cf35feda86a15797573d1e2df4b756065dd
          REVIEW_REVISION: baseline
        run: flock /tmp/browser.lock node --experimental-strip-types ../harness/scripts/capture-entry.mjs
      - name: Candidate native scoped checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: candidate
        run: flock /tmp/browser.lock node --experimental-strip-types ../harness/scripts/capture-entry.mjs
      - name: Atomically transport at most three untouched original PNGs for whole job
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 harness/scripts/emit-originals.py baseline/artifacts/entry-review candidate/artifacts/entry-review
  camp-320-rotate:
    name: Physical places, exact paid upgrades, rotation and deliberate Battle
