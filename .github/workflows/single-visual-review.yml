          (cd candidate; bounded npm ci --ignore-scripts; bounded npm run build; bounded npx --no-install playwright install --with-deps chromium)
      - name: Candidate native scoped checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: candidate
        run: flock /tmp/browser.lock node --experimental-strip-types ../harness/scripts/capture-entry.mjs
      - name: Atomically transport at most three untouched original PNGs for whole job
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 harness/scripts/emit-originals.py candidate/artifacts/entry-review
  preferences-home-390:
    name: Separate Preferences, Home, late saving warning and recovery ownership
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_CASE: preferences-home-390
    steps:
      - uses: actions/checkout@v7
