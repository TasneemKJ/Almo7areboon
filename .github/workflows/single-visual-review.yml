name: Single visual review 805969b
# Disposable verification branch only. Never merge these review files into a product PR.
on:
  push:
    branches: ['qa/atmosphere-almo-805969b-20261005']
permissions:
  contents: read
concurrency:
  group: single-visual-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    name: Render ${{ matrix.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - revision: baseline
            source: b7ba32ccd6070f5a7d52ebd7317a193798e7256f
          - revision: candidate
            source: 805969b28bd7326ed73cdf9f8a58fbf70379052b
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      SOURCE_SHA: ${{ matrix.source }}
      REVIEW_REVISION: ${{ matrix.revision }}
      REVIEW_Al-bayyara: Al-bayyara
    steps:
      - name: Check out disposable review harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: harness
      - name: Check out exact product source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify immutable source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'PRODUCT_SOURCE %s %s\n' "$REVIEW_REVISION" "$SOURCE_SHA"
          git rev-parse 'HEAD^{tree}'
      - id: install
        run: npm ci --ignore-scripts
      - name: Source contracts (failure remains visible)
        id: tests
        run: npm test
      - name: Repository build gate
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Install pinned screenshot browser
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npx playwright install --with-deps chromium
      - name: Canonical actual-touch phone and desktop frames
        id: captures
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        timeout-minutes: 12
        run: flock /tmp/browser.lock node --experimental-strip-types ../harness/scripts/capture-review.mjs
      - name: Existing native mobile reliability suite
        id: journeys
        if: ${{ !cancelled() && matrix.revision == 'candidate' && steps.browser.outcome == 'success' }}
        timeout-minutes: 8
        run: MOBILE_ASSERT=1 MOBILE_ENGINES=chromium flock /tmp/browser.lock node --experimental-strip-types scripts/verify-mobile.mjs
      - name: Native command, save and offline browser contracts
        id: commands
        if: ${{ !cancelled() && matrix.revision == 'candidate' && steps.browser.outcome == 'success' }}
        timeout-minutes: 12
        env:
          QA_ENGINE: chromium
        run: flock /tmp/browser.lock node --experimental-strip-types scripts/verify-battle-banner.mjs
      - name: Original PNG log transport (artifact quota fallback)
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: python ../harness/scripts/emit-originals.py artifacts/single-review
      - name: Explicit source and browser outcomes
        if: ${{ always() }}
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python - <<'PYTHON'
          import json, os
          steps = json.loads(os.environ['OUTCOMES'])
          names = ['tests', 'build', 'diagnostic', 'browser', 'captures', 'journeys', 'commands']
          outcome = {name: steps.get(name, {}).get('outcome', 'not-run') for name in names}
          result = {'sourceCommit': os.environ['SOURCE_SHA'], 'revision': os.environ['REVIEW_REVISION'], 'outcomes': outcome}
          print('REVIEW_OUTCOMES ' + json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Exact source: ' + result['sourceCommit'] + '\n\n')
              output.write('\n'.join('- ' + name + ': ' + state for name, state in outcome.items()) + '\n')
              output.write('\nDiagnostic packaging never establishes that the source/build gate passes. Canonical PNG bytes are source/hash stamped in bounded logs; no artifact storage or deploy action is used.\n')
          PYTHON
